// 每日產能規則（週幾可製作／出貨幾顆），對應 schema.sql 的 capacity_rules 表。
// key 是 JS 的 getDay()（0=週日...6=週六）。這裡的預設值符合目前的規則：
//   出貨日 週二～週五（dow 2-5）＝ 42 顆/天
//   出貨日 週六～週一（dow 6,0,1）＝ 98 顆/天
// 也剛好等於「今日製作、明日出貨」下的製作規則：週一～四 42顆/天、週五～日 98顆/天，
// 因為 capacity_rules 本來就是同一份規則，只是製作日 = 出貨日 - 1 天。
let CAPACITY_RULES = { 0: 98, 1: 98, 2: 42, 3: 42, 4: 42, 5: 42, 6: 98 };

// 每日「剩餘顆數」改由資料庫的 daily_quota / daily_production_quota view 提供
// （見 schema.sql 9. 與 9-1.），這裡的 map 由 useMooncakeStore 在載入資料後
// 填入，key 是 ISO 日期字串，value 是剩餘顆數。找不到資料時退回用
// CAPACITY_RULES 現場算（例如資料庫還沒連上時的離線預覽）。
let REMAINING_BY_SHIP_DATE = {};
let REMAINING_BY_PRODUCTION_DATE = {};

/* ------------------------------ Date / quota helpers ------------------------------ */
function toISODate(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${day}`;
}
function parseISODate(s) {
  const [y, m, d] = s.split("-").map(Number);
  return new Date(y, m - 1, d);
}
function getDayOfWeek(iso) {
  return parseISODate(iso).getDay();
}
function dailyCapacity(iso) {
  const dow = getDayOfWeek(iso);
  return CAPACITY_RULES[dow] ?? 42;
}
function isWithinOrderWindow(iso) {
  return iso >= ORDER_WINDOW.start && iso <= ORDER_WINDOW.end;
}
function addDays(iso, n) {
  const d = parseISODate(iso);
  d.setDate(d.getDate() + n);
  return toISODate(d);
}
// Production always happens the day before the ship date (e.g. ship 9/2 → make on 9/1).
let PRODUCTION_WINDOW = { start: addDays(ORDER_WINDOW.start, -1), end: addDays(ORDER_WINDOW.end, -1) };
// 資料庫的 order_window 更新後（見 loadCatalogFromSupabase），呼叫這個函式
// 讓 ORDER_WINDOW / PRODUCTION_WINDOW 兩個常數同步更新，維持「製作日 = 出貨日 - 1」。
function syncOrderWindow(startDate, endDate) {
  ORDER_WINDOW.start = startDate;
  ORDER_WINDOW.end = endDate;
  PRODUCTION_WINDOW.start = addDays(startDate, -1);
  PRODUCTION_WINDOW.end = addDays(endDate, -1);
}
function isWithinProductionWindow(iso) {
  return iso >= PRODUCTION_WINDOW.start && iso <= PRODUCTION_WINDOW.end;
}

/* ============================================================================
   Supabase 資料存取層
   ----------------------------------------------------------------------------
   這一層負責兩件事：
     1. 把資料庫的 snake_case 欄位（ship_date、buyer_name...）轉成畫面元件
        原本就在用的 camelCase 物件形狀（shipDate、buyerName...），
        這樣下面 90% 既有的畫面元件完全不用改。
     2. 把所有「會寫入資料」的動作都收斂成明確的函式，方便追蹤、也方便之後
        要加 loading / 錯誤處理時只改一個地方。
   對應的資料表結構、RLS 政策、RPC 函式請見同批交付的 schema.sql。
============================================================================ */

// ---- 小工具：DB row → 畫面用物件 的轉換 ----
function mapShipmentItemFromDb(row) {
  const product = PRODUCTS.find((p) => p.id === row.product_id);
  return {
    productId: row.product_id,
    productName: product ? product.name : row.product_id,
    emoji: product ? product.emoji : "",
    tierQty: row.tier_qty,
    tierLabel: row.tier_label,
    tierPrice: Number(row.tier_price),
    boxCount: row.box_count,
    pieces: row.pieces,
    lineTotal: Number(row.line_total),
  };
}
function mapShipmentFromDb(row) {
  return {
    id: row.id, // Supabase 的 shipment uuid，後台編輯/更新狀態要用到
    shipDate: row.ship_date,
    shipMethodId: row.ship_method_id,
    shipInfo: row.ship_info,
    items: (row.shipment_items || []).map(mapShipmentItemFromDb),
    shippingFee: Number(row.shipping_fee),
    status: row.status,
  };
}
function mapRemittanceFromDb(row) {
  if (!row) return null;
  return {
    method: row.method,
    date: row.remit_date,
    amount: Number(row.amount),
    bankLast5: row.bank_last5 || "",
    jkoName: row.jko_name || "",
    note: row.note || "",
    reportedAt: row.reported_at,
  };
}
function mapOrderFromDb(row) {
  const shipmentsRaw = Array.isArray(row.shipments) ? row.shipments : [];
  const shipments = shipmentsRaw.map(mapShipmentFromDb);
  const remittanceRaw = Array.isArray(row.remittances) ? row.remittances[0] : row.remittances;
  return {
    id: row.id,
    createdAt: row.created_at,
    buyerName: row.buyer_name,
    buyerPhone: row.buyer_phone,
    note: row.note || "",
    shipments,
    totalAmount: Number(row.total_amount),
    remittance: mapRemittanceFromDb(remittanceRaw),
    reconciled: !!row.reconciled,
  };
}

// ---- 把畫面上「購物車」的 shipments（camelCase）轉成 create_order() 要的 jsonb ----
function shipmentsToRpcPayload(shipments) {
  return shipments.map((s) => ({
    ship_date: s.shipDate,
    ship_method_id: s.shipMethodId,
    ship_info: s.shipInfo || null,
    shipping_fee: s.shippingFee,
    items: s.items.map((it) => ({
      product_id: it.productId,
      tier_qty: it.tierQty,
      tier_label: it.tierLabel,
      tier_price: it.tierPrice,
      box_count: it.boxCount,
    })),
  }));
}

const db = {
  // 目錄資料：商品／出貨方式／訂購期間／每日產能規則
  async fetchCatalog() {
    const [productsRes, tiersRes, shipMethodsRes, windowRes, capacityRes] = await Promise.all([
      supabase.from("products").select("*").eq("active", true).order("sort_order"),
      supabase.from("product_tiers").select("*"),
      supabase.from("ship_methods").select("*").eq("active", true).order("sort_order"),
      supabase.from("order_window").select("*").maybeSingle(),
      supabase.from("capacity_rules").select("*"),
    ]);
    const firstError = productsRes.error || tiersRes.error || shipMethodsRes.error || windowRes.error || capacityRes.error;
    if (firstError) throw firstError;

    const products = (productsRes.data || []).map((p) => ({
      id: p.id, name: p.name, emoji: p.emoji, desc: p.description, isCombo: p.is_combo,
      tiers: (tiersRes.data || [])
        .filter((t) => t.product_id === p.id)
        .sort((a, b) => a.qty - b.qty)
        .map((t) => ({ qty: t.qty, price: Number(t.price), label: t.label })),
    }));
    const shipMethods = (shipMethodsRes.data || []).map((m) => ({
      id: m.id, label: m.label, type: m.type, fee: Number(m.fee), note: m.note,
    }));
    const capacityRules = {};
    (capacityRes.data || []).forEach((r) => { capacityRules[r.dow] = r.capacity; });

    return {
      products, shipMethods,
      orderWindow: windowRes.data ? { start: windowRes.data.start_date, end: windowRes.data.end_date } : null,
      capacityRules,
    };
  },

  // 每日剩餘顆數（出貨日曆 + 製作排程日曆共用同一份 capacity_rules，只是日期欄位不同）
  async fetchQuota() {
    const [shipRes, productionRes] = await Promise.all([
      supabase.from("daily_quota").select("*"),
      supabase.from("daily_production_quota").select("*"),
    ]);
    if (shipRes.error) throw shipRes.error;
    if (productionRes.error) throw productionRes.error;
    const byShipDate = {};
    (shipRes.data || []).forEach((r) => { byShipDate[r.ship_date] = r.remaining_pieces; });
    const byProductionDate = {};
    (productionRes.data || []).forEach((r) => { byProductionDate[r.production_date] = r.production_remaining; });
    return { byShipDate, byProductionDate };
  },

  // 結帳：呼叫 create_order()，資料庫端會檢查每日產能是否足夠
  async createOrder({ buyerName, buyerPhone, note, shipments }) {
    const { data, error } = await supabase.rpc("create_order", {
      p_buyer_name: buyerName,
      p_buyer_phone: buyerPhone,
      p_note: note || null,
      p_shipments: shipmentsToRpcPayload(shipments),
    });
    if (error) throw error;
    return data; // 新訂單編號
  },

  // 顧客查自己的訂單：僅需訂單編號
  // ⚠️ 已移除電話核對（PM 決策）：任何知道訂單編號的人都查得到這筆訂單的完整明細。
  async lookupOrder(orderId) {
    const { data, error } = await supabase.rpc("lookup_order", {
      p_order_id: orderId,
    });
    if (error) throw error;
    if (!data) return null;
    return mapOrderFromDb(data);
  },

  // 回報匯款：僅需訂單編號
  // ⚠️ 已移除電話核對（PM 決策）：任何知道訂單編號的人都可以幫這筆訂單回報／覆蓋匯款資料。
  async submitRemittance(orderId, remit) {
    const { error } = await supabase.rpc("submit_remittance", {
      p_order_id: orderId,
      p_method: remit.method,
      p_remit_date: remit.date,
      p_amount: remit.amount,
      p_bank_last5: remit.bankLast5 || null,
      p_jko_name: remit.jkoName || null,
      p_note: remit.note || null,
    });
    if (error) throw error;
  },

  // ---- 以下為後台管理員專用（需先登入，由 RLS 依 is_admin() 放行） ----
  async fetchAllOrders() {
    const { data, error } = await supabase
      .from("orders")
      .select("*, shipments(*, shipment_items(*)), remittances(*)")
      .order("created_at", { ascending: false });
    if (error) throw error;
    return (data || []).map(mapOrderFromDb);
  },

  async toggleReconciled(orderId, nextValue) {
    const { error } = await supabase.from("orders").update({ reconciled: nextValue }).eq("id", orderId);
    if (error) throw error;
  },

  async updateShipmentStatus(shipmentId, status) {
    const { error } = await supabase.from("shipments").update({ status }).eq("id", shipmentId);
    if (error) throw error;
  },

  // 後台編輯出貨批次：改走 SECURITY DEFINER 的 admin_update_shipment RPC（見 schema.sql），
  // 由資料庫端一次做完「更新 shipments → 刪除舊 shipment_items → 寫入新 shipment_items」，
  // 並在函式內用 is_admin() 檢查權限——不再讓瀏覽器直接對 shipment_items 做 delete/insert，
  // 因為那三個步驟各自受 RLS 規則管控，容易漏掉「已登入管理員」的寫入權限（過去就是卡在
  // shipment_items 的 insert 被 RLS 擋下）。
  async updateShipment(shipmentId, newShipmentData) {
    const { error } = await supabase.rpc("admin_update_shipment", {
      p_shipment_id: shipmentId,
      p_ship_date: newShipmentData.shipDate,
      p_ship_method_id: newShipmentData.shipMethodId,
      p_ship_info: newShipmentData.shipInfo || null,
      p_shipping_fee: newShipmentData.shippingFee,
      p_items: newShipmentData.items.map((it) => ({
        product_id: it.productId,
        tier_qty: it.tierQty,
        tier_label: it.tierLabel,
        tier_price: it.tierPrice,
        box_count: it.boxCount,
      })),
    });
    if (error) throw error;
  },

  // ---- 管理員登入（真正的 Supabase Auth，取代舊版的通關密語） ----
  async adminSignIn(email, password) {
    const { data, error } = await supabase.auth.signInWithPassword({ email, password });
    if (error) throw error;
    const { data: adminRow, error: adminErr } = await supabase
      .from("admin_users")
      .select("user_id")
      .eq("user_id", data.user.id)
      .maybeSingle();
    if (adminErr) throw adminErr;
    if (!adminRow) {
      await supabase.auth.signOut();
      throw new Error("此帳號沒有後台管理權限，請聯絡系統管理員開通。");
    }
    return data.session;
  },
  async adminSignOut() {
    await supabase.auth.signOut();
  },
  async getSession() {
    const { data } = await supabase.auth.getSession();
    return data.session;
  },
};

/* ------------------------------ Small UI primitives ------------------------------ */
function Button({ children, variant = "primary", size = "md", onClick, disabled, style, type = "button", href }) {
  const base = {
    fontFamily: fontBody, fontWeight: 700, borderRadius: TOKENS.radius.full, border: "none",
    cursor: disabled ? "not-allowed" : "pointer",
    transition: "transform .12s ease, box-shadow .12s ease, opacity .12s ease",
    opacity: disabled ? 0.45 : 1, display: "inline-flex", alignItems: "center", justifyContent: "center", gap: "8px",
    textDecoration: "none", boxSizing: "border-box",
  };
  const sizes = {
    sm: { padding: "8px 16px", fontSize: "13px" },
    md: { padding: "12px 24px", fontSize: "15px" },
    lg: { padding: "16px 32px", fontSize: "17px" },
  };
  const variants = {
    primary: { background: `linear-gradient(135deg, ${TOKENS.color.persimmon}, ${TOKENS.color.persimmonDark})`, color: "#FFF7EC", boxShadow: "0 6px 16px rgba(198,67,43,0.28)" },
    gold: { background: `linear-gradient(135deg, ${TOKENS.color.gold}, #D68B24)`, color: "#4A2E10", boxShadow: "0 6px 16px rgba(232,163,61,0.32)" },
    ghost: { background: "transparent", color: TOKENS.color.brown, border: `1.5px solid ${TOKENS.color.line}`, boxShadow: "none" },
    subtle: { background: "#F3E9D8", color: TOKENS.color.brown, boxShadow: "none" },
    danger: { background: "#FBEAE6", color: TOKENS.color.persimmonDark, boxShadow: "none" },
  };
  const sharedProps = {
    onMouseDown: (e) => !disabled && (e.currentTarget.style.transform = "scale(0.97)"),
    onMouseUp: (e) => (e.currentTarget.style.transform = "scale(1)"),
    onMouseLeave: (e) => (e.currentTarget.style.transform = "scale(1)"),
    style: { ...base, ...sizes[size], ...variants[variant], ...style },
  };

  // 有 href 時渲染成真正的 <a> 連結（一般頁面導覽），而不是用 window.open 開小彈窗——
  // 分享到 LINE 這類會觸發「切換到 App」的連結，用 window.open 的彈窗常常會被手機瀏覽器
  // 擋掉或改走網頁版陽春畫面，導致 LINE 顯示空白訊息框、要求使用者自己輸入文字才能送出。
  // 改用一般 <a target="_blank"> 連結，行動裝置才能正確跳轉到 LINE App 並帶入完整訊息。
  if (href && !disabled) {
    return (
      <a href={href} target="_blank" rel="noopener noreferrer" {...sharedProps}>
        {children}
      </a>
    );
  }

  return (
    <button
      type={type}
      onClick={disabled ? undefined : onClick}
      disabled={disabled}
      {...sharedProps}
    >
      {children}
    </button>
  );
}

/* ------------------------------ App-level data store ------------------------------ */
function useMooncakeStore() {
  // ---- 目錄與餘量（公開資料，一進站就抓） ----
  const [catalogLoaded, setCatalogLoaded] = useState(false);
  const [catalogError, setCatalogError] = useState(null);
  const [quotaVersion, setQuotaVersion] = useState(0); // 每次結帳成功後 +1，觸發餘量重新整理

  // ---- 後台專用（僅管理員登入後才有內容） ----
  const [orders, setOrders] = useState([]);
  const [adminSession, setAdminSession] = useState(null);
  const [adminLoading, setAdminLoading] = useState(false);
  const [adminError, setAdminError] = useState(null);
  const [ordersLoading, setOrdersLoading] = useState(false);

  const refreshQuota = useCallback(async () => {
    const quota = await db.fetchQuota();
    REMAINING_BY_SHIP_DATE = quota.byShipDate;
    REMAINING_BY_PRODUCTION_DATE = quota.byProductionDate;
    setQuotaVersion((v) => v + 1);
  }, []);

  // 開站載入一次：商品／出貨方式／訂購期間／產能規則／目前餘量
  useEffect(() => {
    let cancelled = false;
    (async () => {
      try {
        const catalog = await db.fetchCatalog();
        if (cancelled) return;
        if (catalog.products.length > 0) { PRODUCTS.length = 0; PRODUCTS.push(...catalog.products); }
        if (catalog.shipMethods.length > 0) { SHIP_METHODS.length = 0; SHIP_METHODS.push(...catalog.shipMethods); }
        if (catalog.orderWindow) syncOrderWindow(catalog.orderWindow.start, catalog.orderWindow.end);
        if (Object.keys(catalog.capacityRules).length > 0) CAPACITY_RULES = catalog.capacityRules;
        await refreshQuota();
        if (!cancelled) setCatalogLoaded(true);
      } catch (err) {
        console.error("讀取 Supabase 目錄資料失敗", err);
        if (!cancelled) { setCatalogError(err); setCatalogLoaded(true); } // 仍放行，前端會用預設值離線展示
      }
    })();
    return () => { cancelled = true; };
  }, [refreshQuota]);

  // 監聽 Supabase Auth 登入狀態（換分頁、重新整理後仍記得登入）
  useEffect(() => {
    let cancelled = false;
    db.getSession().then((session) => { if (!cancelled) setAdminSession(session); });
    const { data: sub } = supabase.auth.onAuthStateChange((_event, session) => {
      setAdminSession(session);
      if (!session) setOrders([]);
    });
    return () => { cancelled = true; sub.subscription.unsubscribe(); };
  }, []);

  const refreshAdminOrders = useCallback(async () => {
    setOrdersLoading(true);
    try {
      const list = await db.fetchAllOrders();
      setOrders(list);
    } catch (err) {
      console.error("讀取後台訂單失敗", err);
      window.alert("讀取訂單失敗：" + (err.message || err));
    } finally {
      setOrdersLoading(false);
    }
  }, []);

  // 登入後自動抓一次訂單
  useEffect(() => {
    if (adminSession) refreshAdminOrders();
  }, [adminSession, refreshAdminOrders]);

  const remainingForDate = useCallback((iso) => {
    const remote = REMAINING_BY_SHIP_DATE[iso];
    if (remote !== undefined) return Math.max(0, remote);
    return dailyCapacity(iso); // 資料庫還沒回應前的暫時值
  }, [quotaVersion]);

  const productionRemainingForDate = useCallback((iso) => {
    const remote = REMAINING_BY_PRODUCTION_DATE[iso];
    if (remote !== undefined) return Math.max(0, remote);
    return dailyCapacity(addDays(iso, 1));
  }, [quotaVersion]);

  // 「該出貨日總顆數 / 每日產能」給 ProductionSchedule 顯示用
  const bookedByDate = useMemo(() => {
    const map = {};
    Object.keys(REMAINING_BY_SHIP_DATE).forEach((iso) => {
      map[iso] = Math.max(0, dailyCapacity(iso) - REMAINING_BY_SHIP_DATE[iso]);
    });
    return map;
  }, [quotaVersion]);

  const createOrder = useCallback(async (orderDraft) => {
    const orderId = await db.createOrder(orderDraft);
    await refreshQuota();
    return {
      id: orderId,
      createdAt: new Date().toISOString(),
      buyerName: orderDraft.buyerName,
      buyerPhone: orderDraft.buyerPhone,
      note: orderDraft.note || "",
      shipments: orderDraft.shipments,
      totalAmount: orderDraft.totalAmount,
      remittance: null,
      reconciled: false,
    };
  }, [refreshQuota]);

  const lookupOrder = useCallback(async (orderId) => {
    return db.lookupOrder(orderId);
  }, []);

  const submitRemittance = useCallback(async (orderId, remit) => {
    await db.submitRemittance(orderId, remit);
  }, []);

  // 後台專用：送出/編輯匯款回報後，順便重新整理後台的訂單清單，畫面才會立刻反映最新資料。
  const adminSubmitRemittance = useCallback(async (orderId, remit) => {
    await db.submitRemittance(orderId, remit);
    await refreshAdminOrders();
  }, [refreshAdminOrders]);

  const toggleReconciled = useCallback(async (orderId) => {
    const order = orders.find((o) => o.id === orderId);
    if (!order) return;
    const next = !order.reconciled;
    setOrders((prev) => prev.map((o) => (o.id === orderId ? { ...o, reconciled: next } : o))); // 樂觀更新
    try {
      await db.toggleReconciled(orderId, next);
    } catch (err) {
      console.error(err);
      window.alert("更新對帳狀態失敗：" + (err.message || err));
      refreshAdminOrders();
    }
  }, [orders, refreshAdminOrders]);

  const updateShipmentStatus = useCallback(async (orderId, shipmentIdx, status) => {
    const order = orders.find((o) => o.id === orderId);
    const shipment = order && order.shipments[shipmentIdx];
    if (!shipment) return;
    setOrders((prev) => prev.map((o) => {
      if (o.id !== orderId) return o;
      return { ...o, shipments: o.shipments.map((s, idx) => (idx === shipmentIdx ? { ...s, status } : s)) };
    })); // 樂觀更新
    try {
      await db.updateShipmentStatus(shipment.id, status);
    } catch (err) {
      console.error(err);
      window.alert("更新出貨狀態失敗：" + (err.message || err));
      refreshAdminOrders();
    }
  }, [orders, refreshAdminOrders]);

  const updateShipment = useCallback(async (orderId, shipmentIdx, newShipmentData) => {
    const order = orders.find((o) => o.id === orderId);
    const shipment = order && order.shipments[shipmentIdx];
    if (!shipment) return;
    try {
      await db.updateShipment(shipment.id, newShipmentData);
      await Promise.all([refreshAdminOrders(), refreshQuota()]);
    } catch (err) {
      console.error(err);
      window.alert("更新出貨批次失敗：" + (err.message || err));
    }
  }, [orders, refreshAdminOrders, refreshQuota]);

  const adminSignIn = useCallback(async (email, password) => {
    setAdminLoading(true);
    setAdminError(null);
    try {
      const session = await db.adminSignIn(email, password);
      setAdminSession(session);
    } catch (err) {
      setAdminError(err.message || String(err));
      throw err;
    } finally {
      setAdminLoading(false);
    }
  }, []);

  const adminSignOut = useCallback(async () => {
    await db.adminSignOut();
    setAdminSession(null);
    setOrders([]);
  }, []);

  return {
    catalogLoaded, catalogError,
    orders, ordersLoading, bookedByDate,
    remainingForDate, productionRemainingForDate,
    createOrder, lookupOrder, submitRemittance, adminSubmitRemittance,
    toggleReconciled, updateShipmentStatus, updateShipment, refreshAdminOrders,
    adminSession, adminLoading, adminError, adminSignIn, adminSignOut,
  };
}

function Stepper({ step }) {
  const steps = ["選擇日期", "選購商品", "出貨方式", "確認結單"];
  return (
    <div style={{ display: "flex", alignItems: "center", gap: "6px", marginBottom: "28px", flexWrap: "wrap" }}>
      {steps.map((label, i) => {
        const idx = i + 1;
        const active = idx === step;
        const done = idx < step;
        return (
          <React.Fragment key={label}>
            <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
              <div style={{
                width: "26px", height: "26px", borderRadius: "50%", display: "flex", alignItems: "center", justifyContent: "center",
                fontSize: "12px", fontWeight: 700,
                background: done ? TOKENS.color.leaf : active ? TOKENS.color.persimmon : "#EFE3CF",
                color: done || active ? "#fff" : TOKENS.color.brownSoft,
              }}>
                {done ? "✓" : idx}
              </div>
              <span style={{ fontSize: "13px", fontWeight: active ? 700 : 500, color: active ? TOKENS.color.brown : TOKENS.color.brownSoft }}>{label}</span>
            </div>
            {idx < steps.length && <div style={{ width: "20px", height: "1px", background: TOKENS.color.line }} />}
          </React.Fragment>
        );
      })}
    </div>
  );
}

function CalendarPicker({ remainingForDate, selectedDate, onSelect }) {
  const [viewMonth, setViewMonth] = useState(() => {
    const d = parseISODate(ORDER_WINDOW.start);
    return new Date(d.getFullYear(), d.getMonth(), 1);
  });

  // 最早可訂購日 = 系統日 + 2（例如今天 9/5，最早只能選 9/7，9/6（含）以前都不可選）。
  const earliestOrderableDate = useMemo(() => addDays(toISODate(new Date()), 2), []);

  const monthDates = useMemo(() => {
    const first = viewMonth;
    const startDow = first.getDay();
    const daysInMonth = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startDow; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(toISODate(new Date(first.getFullYear(), first.getMonth(), d)));
    return cells;
  }, [viewMonth]);

  const canGoPrev = useMemo(() => {
    const prevMonthEnd = new Date(viewMonth.getFullYear(), viewMonth.getMonth(), 0);
    return toISODate(prevMonthEnd) >= ORDER_WINDOW.start;
  }, [viewMonth]);
  const canGoNext = useMemo(() => {
    const nextMonthStart = new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1);
    return toISODate(nextMonthStart) <= ORDER_WINDOW.end;
  }, [viewMonth]);

  return (
    <Card>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "18px" }}>
        <button aria-label="上個月" onClick={() => canGoPrev && setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1))} disabled={!canGoPrev}
          style={{ background: "none", border: "none", fontSize: "18px", cursor: canGoPrev ? "pointer" : "default", color: canGoPrev ? TOKENS.color.brown : "#D8CBB2", padding: "6px" }}>‹</button>
        <div style={{ fontFamily: fontDisplay, fontWeight: 700, fontSize: "18px", color: TOKENS.color.brown }}>{viewMonth.getFullYear()} 年 {MONTH_LABELS[viewMonth.getMonth()]}</div>
        <button aria-label="下個月" onClick={() => canGoNext && setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1))} disabled={!canGoNext}
          style={{ background: "none", border: "none", fontSize: "18px", cursor: canGoNext ? "pointer" : "default", color: canGoNext ? TOKENS.color.brown : "#D8CBB2", padding: "6px" }}>›</button>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: "4px", marginBottom: "6px" }}>
        {WEEKDAY_LABELS.map((w) => <div key={w} style={{ textAlign: "center", fontSize: "12px", fontWeight: 700, color: TOKENS.color.brownSoft }}>{w}</div>)}
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: "4px" }}>
        {monthDates.map((iso, i) => {
          if (!iso) return <div key={`empty-${i}`} />;
          const withinCutoff = iso >= earliestOrderableDate;
          const inWindow = isWithinOrderWindow(iso) && withinCutoff;
          const cap = dailyCapacity(iso);
          const remaining = remainingForDate(iso);
          const ratio = remaining / cap;
          const soldOut = inWindow && remaining <= 0;
          const selectable = inWindow && !soldOut;
          const isSelected = selectedDate === iso;
          const dayNum = parseISODate(iso).getDate();

          return (
            <button key={iso} disabled={!selectable} onClick={() => selectable && onSelect(iso)}
              style={{
                display: "flex", flexDirection: "column", alignItems: "center", gap: "3px", padding: "8px 2px", borderRadius: TOKENS.radius.sm,
                border: isSelected ? `2px solid ${TOKENS.color.persimmon}` : "2px solid transparent",
                background: isSelected ? "#FCEFE9" : "transparent",
                cursor: selectable ? "pointer" : "default", opacity: inWindow ? 1 : 0.28,
              }}>
              <span style={{ fontSize: "13px", fontWeight: isSelected ? 800 : 500, color: soldOut ? "#C7B79A" : TOKENS.color.brown, textDecoration: soldOut ? "line-through" : "none" }}>{dayNum}</span>
              {inWindow ? <MoonQuota ratio={soldOut ? 0 : ratio} size={22} /> : <div style={{ height: 22 }} />}
              {inWindow && <span style={{ fontSize: "10px", color: soldOut ? "#C7B79A" : TOKENS.color.brownSoft }}>{soldOut ? "已額滿" : `餘${remaining}顆`}</span>}
            </button>
          );
        })}
      </div>

      <div style={{ display: "flex", gap: "16px", marginTop: "18px", paddingTop: "16px", borderTop: `1px dashed ${TOKENS.color.line}`, fontSize: "12px", color: TOKENS.color.brownSoft, flexWrap: "wrap" }}>
        <div style={{ display: "flex", alignItems: "center", gap: "6px" }}><MoonQuota ratio={1} size={16} /> 顆數充裕</div>
        <div style={{ display: "flex", alignItems: "center", gap: "6px" }}><MoonQuota ratio={0.25} size={16} /> 顆數有限</div>
        <div style={{ display: "flex", alignItems: "center", gap: "6px" }}><MoonQuota ratio={0} size={16} /> 已額滿</div>
        <div>可訂購期間：{ORDER_WINDOW.start} ～ {ORDER_WINDOW.end}</div>
      </div>
    </Card>
  );
}

function selectionsToItems(selections) {
  return Object.entries(selections)
    .filter(([, count]) => count > 0)
    .map(([key, count]) => {
      const [productId, tierIdxStr] = key.split("::");
      const tierIdx = Number(tierIdxStr);
      const product = PRODUCTS.find((p) => p.id === productId);
      const tier = product.tiers[tierIdx];
      return {
        productId, productName: product.name, emoji: product.emoji,
        tierQty: tier.qty, tierLabel: tier.label, tierPrice: tier.price,
        boxCount: count, pieces: tier.qty * count, lineTotal: tier.price * count,
      };
    });
}

function OrderingFlow({ store }) {
  const [step, setStep] = useState(1);
  const [selectedDate, setSelectedDate] = useState(null);
  const [draftItems, setDraftItems] = useState(null);
  const [cart, setCart] = useState([]);
  const [completedOrder, setCompletedOrder] = useState(null);
  const [view, setView] = useState("flow");

  // Pieces this buyer has already put in their own cart, grouped by ship date —
  // must be subtracted from the day's remaining quota so the SAME buyer can't
  // over-book a date across multiple cart entries within one checkout.
  const cartReservedByDate = useMemo(() => {
    const map = {};
    cart.forEach((entry) => {
      const pieces = entry.items.reduce((s, i) => s + i.pieces, 0);
      map[entry.shipDate] = (map[entry.shipDate] || 0) + pieces;
    });
    return map;
  }, [cart]);

  const effectiveRemainingForDate = useCallback(
    (iso) => Math.max(0, store.remainingForDate(iso) - (cartReservedByDate[iso] || 0)),
    [store, cartReservedByDate]
  );

  function handleSelectDate(iso) { setSelectedDate(iso); setStep(2); }
  function handleAddToCartStep2(items) { setDraftItems(items); setStep(3); }
  function handleShippingConfirm(shipping) {
    setCart((prev) => [...prev, { shipDate: selectedDate, items: draftItems, ...shipping }]);
    setDraftItems(null); setSelectedDate(null); setStep(1);
  }
  function handleCheckout() { setStep(5); }

  const [submitting, setSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState(null);

  async function handleSubmitOrder({ buyerName, buyerPhone, note }) {
    const shipments = cart.map((entry) => ({
      shipDate: entry.shipDate, shipMethodId: entry.shipMethodId, shipInfo: entry.shipInfo,
      items: entry.items, shippingFee: entry.shippingFee, status: "pending",
    }));
    const totalAmount = shipments.reduce((sum, s) => sum + s.items.reduce((is, i) => is + i.lineTotal, 0) + s.shippingFee, 0);
    setSubmitting(true);
    setSubmitError(null);
    try {
      const order = await store.createOrder({ buyerName, buyerPhone, note, shipments, totalAmount });
      setCompletedOrder(order); setView("confirmation");
    } catch (err) {
      // 常見情況：結帳當下剛好額滿（資料庫端把關），提醒買家換一天或減少數量
      setSubmitError(err.message || "建立訂單失敗，請稍後再試");
    } finally {
      setSubmitting(false);
    }
  }

  function resetAll() { setStep(1); setSelectedDate(null); setDraftItems(null); setCart([]); setCompletedOrder(null); setView("flow"); }

  if (view === "confirmation" && completedOrder) {
    return (
      <div style={{ maxWidth: "560px", margin: "0 auto" }}>
        <OrderConfirmation order={completedOrder} onGoLookup={() => window.dispatchEvent(new CustomEvent("nav", { detail: "remit" }))} onNewOrder={resetAll} />
      </div>
    );
  }

  return (
    <div style={{ maxWidth: "980px", margin: "0 auto" }}>
      <Stepper step={Math.min(step, 4)} />
      <div className={`order-flow-grid${cart.length > 0 && step !== 5 ? " has-cart" : ""}`}>
        <div>
          {step === 1 && (<><SectionTitle eyebrow="STEP 1" title="選擇出貨日期" sub="日曆上的月亮圖示代表當日剩餘顆數，愈滿代表可訂購顆數愈充裕" /><CalendarPicker remainingForDate={effectiveRemainingForDate} selectedDate={selectedDate} onSelect={handleSelectDate} /></>)}
          {step === 2 && selectedDate && <ProductPicker shipDate={selectedDate} remaining={effectiveRemainingForDate(selectedDate)} onAddToCart={handleAddToCartStep2} onBack={() => setStep(1)} />}
          {step === 3 && <ShippingForm onConfirm={handleShippingConfirm} onBack={() => setStep(2)} />}
          {step === 5 && <CheckoutForm cart={cart} onSubmit={handleSubmitOrder} onBack={() => setStep(1)} submitting={submitting} submitError={submitError} />}
        </div>
        {cart.length > 0 && step !== 5 && <CartSummary cart={cart} onRemove={(idx) => setCart((prev) => prev.filter((_, i) => i !== idx))} onCheckout={handleCheckout} />}
      </div>
    </div>
  );
}

function RemittanceFlow({ store, initialOrderId }) {
  const [orderId, setOrderId] = useState(initialOrderId || "");
  const [order, setOrder] = useState(null);
  const [notFound, setNotFound] = useState(false);
  const [looking, setLooking] = useState(false);
  const [method, setMethod] = useState("銀行轉帳");
  const [date, setDate] = useState("");
  const [amount, setAmount] = useState("");
  const [bankLast5, setBankLast5] = useState("");
  const [jkoName, setJkoName] = useState("");
  const [note, setNote] = useState("");
  const [submitted, setSubmitted] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [submitError, setSubmitError] = useState(null);

  async function handleLookup() {
    if (!orderId.trim()) { setNotFound(true); return; }
    setLooking(true);
    try {
      const found = await store.lookupOrder(orderId);
      if (found) {
        setOrder(found); setNotFound(false);
        if (found.remittance) {
          setMethod(found.remittance.method); setDate(found.remittance.date); setAmount(String(found.remittance.amount));
          setBankLast5(found.remittance.bankLast5 || ""); setJkoName(found.remittance.jkoName || ""); setNote(found.remittance.note || "");
        } else {
          setMethod("銀行轉帳"); setDate(""); setAmount(String(found.totalAmount)); setBankLast5(""); setJkoName(""); setNote("");
        }
        setSubmitted(false);
      } else { setOrder(null); setNotFound(true); }
    } catch (err) {
      console.error(err);
      setOrder(null); setNotFound(true);
    } finally {
      setLooking(false);
    }
  }

  // 從分享連結（?page=remit&order=...）進來時，自動帶入並查詢一次。
  useEffect(() => {
    if (initialOrderId) {
      handleLookup();
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  const canSubmit = date && amount && (method === "銀行轉帳" ? bankLast5.trim() : jkoName.trim()) && !submitting;

  async function handleSubmit() {
    setSubmitting(true);
    setSubmitError(null);
    try {
      await store.submitRemittance(order.id, {
        method, date, amount: Number(amount),
        bankLast5: method === "銀行轉帳" ? bankLast5 : "",
        jkoName: method === "街口" ? jkoName : "",
        note,
      });
      setSubmitted(true);
    } catch (err) {
      setSubmitError(err.message || "回報匯款失敗，請稍後再試");
    } finally {
      setSubmitting(false);
    }
  }

  return (
    <div style={{ maxWidth: "560px", margin: "0 auto" }}>
      <SectionTitle eyebrow="匯款回報" title="填寫匯款資訊" sub="輸入訂單編號查詢，並回報您的匯款資訊" />
      <Card style={{ marginBottom: "20px" }}>
        <Field label="訂單編號" required>
          <div style={{ display: "flex", gap: "8px" }}>
            <TextInput value={orderId} onChange={(e) => setOrderId(e.target.value)} placeholder="例：MC20260828-1001" onKeyDown={(e) => e.key === "Enter" && handleLookup()} />
            <Button variant="primary" onClick={handleLookup} disabled={looking} style={{ flexShrink: 0 }}>{looking ? "查詢中…" : "查詢"}</Button>
          </div>
        </Field>
        {notFound && <div style={{ color: TOKENS.color.persimmonDark, fontSize: "13px", fontWeight: 700 }}>查無此訂單編號，請確認輸入是否正確</div>}
      </Card>

      {order && (
        <>
          <Card style={{ marginBottom: "20px", background: "#F3E9D8" }}>
            <div style={{ fontSize: "13px", color: TOKENS.color.brownSoft, marginBottom: "4px" }}>訂單編號 {order.id}</div>
            <div style={{ fontWeight: 700, color: TOKENS.color.brown }}>訂購人：{order.buyerName}</div>
            <div style={{ fontWeight: 800, fontSize: "18px", color: TOKENS.color.persimmon, fontFamily: fontNum, marginTop: "6px" }}>應付金額：${order.totalAmount}</div>
          </Card>

          <Card>
            {order.remittance && !submitted && <div style={{ fontSize: "12.5px", color: TOKENS.color.warn, fontWeight: 700, marginBottom: "12px", background: "#FBF0DC", padding: "8px 12px", borderRadius: TOKENS.radius.sm }}>此訂單已有匯款回報紀錄，送出將會更新原資料</div>}
            <Field label="轉帳方式" required>
              <div style={{ display: "flex", gap: "10px" }}>
                {["街口", "銀行轉帳"].map((m) => (
                  <button key={m} onClick={() => setMethod(m)} style={{ flex: 1, padding: "10px", borderRadius: TOKENS.radius.sm, border: method === m ? `2px solid ${TOKENS.color.persimmon}` : `1.5px solid ${TOKENS.color.line}`, background: method === m ? "#FCEFE9" : "#FFFCF7", cursor: "pointer", fontWeight: 700, color: TOKENS.color.brown }}>{m}</button>
                ))}
              </div>
            </Field>
            <Field label="轉帳日期" required><TextInput type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
            <Field label="轉帳金額" required><TextInput type="number" value={amount} onChange={(e) => setAmount(e.target.value)} placeholder="請輸入實際轉帳金額" /></Field>
            {method === "銀行轉帳" && <Field label="匯款帳號後五碼" required hint="方便賣家核對匯款紀錄"><TextInput value={bankLast5} onChange={(e) => setBankLast5(e.target.value.slice(0, 5))} placeholder="例：88500" /></Field>}
            {method === "街口" && <Field label="街口帳戶名稱" required hint="您在街口顯示的帳戶名稱，方便賣家核對"><TextInput value={jkoName} onChange={(e) => setJkoName(e.target.value)} placeholder="請輸入街口帳戶名稱" /></Field>}
            <Field label="備註"><TextArea value={note} onChange={(e) => setNote(e.target.value)} placeholder="選填" /></Field>
            <Button variant="primary" style={{ width: "100%" }} disabled={!canSubmit} onClick={handleSubmit}>{submitting ? "送出中…" : "送出匯款回報"}</Button>
            {submitError && <div style={{ marginTop: "12px", color: TOKENS.color.persimmonDark, fontSize: "13px", fontWeight: 700 }}>⚠️ {submitError}</div>}
            {submitted && <div style={{ marginTop: "14px", textAlign: "center", color: TOKENS.color.success, fontWeight: 700, fontSize: "14px" }}>✅ 已完成匯款回報，謝謝您！</div>}
          </Card>
        </>
      )}
    </div>
  );
}

function productionBreakdown(orders, dateFilter) {
  let danhuang = 0, hongdou = 0;
  orders.forEach((o) => o.shipments.forEach((s) => {
    if (dateFilter && s.shipDate !== dateFilter) return;
    s.items.forEach((item) => {
      if (item.productId === "danhuang") danhuang += item.pieces;
      else if (item.productId === "hongdou") hongdou += item.pieces;
      else if (item.productId === "combo") { danhuang += item.pieces / 2; hongdou += item.pieces / 2; }
    });
  }));
  return { danhuang, hongdou };
}

function globalPieceCounts(orders) {
  const counts = { danhuang: 0, hongdou: 0 };
  const unshipped = { danhuang: 0, hongdou: 0 };
  orders.forEach((o) => o.shipments.forEach((s) => {
    s.items.forEach((item) => {
      let d = 0, h = 0;
      if (item.productId === "danhuang") d = item.pieces;
      else if (item.productId === "hongdou") h = item.pieces;
      else if (item.productId === "combo") { d = item.pieces / 2; h = item.pieces / 2; }
      counts.danhuang += d; counts.hongdou += h;
      if (s.status !== "shipped") { unshipped.danhuang += d; unshipped.hongdou += h; }
    });
  }));
  return { counts, unshipped };
}

function AdminMetric({ label, value, tone = "neutral" }) {
  const tones = { neutral: TOKENS.color.brown, persimmon: TOKENS.color.persimmon, gold: "#8A5A17" };

      <div style={{ fontSize: "12px", fontWeight: 700, color: TOKENS.color.brownSoft, marginBottom: "6px" }}>{label}</div>
      <div style={{ fontFamily: fontNum, fontSize: "28px", fontWeight: 800, color: tones[tone] }}>{value}</div>
    </Card>
  );
}

function ProductionSchedule({ store }) {
  // 預設顯示系統日期所在的當月份；若今天剛好落在製作區間內，就直接選今天，
  // 否則退回製作區間的第一天（例如系統日還沒到開賣月份時）。
  const todayIso = toISODate(new Date());
  const [selectedDate, setSelectedDate] = useState(isWithinProductionWindow(todayIso) ? todayIso : PRODUCTION_WINDOW.start);
  const [viewMonth, setViewMonth] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const global = globalPieceCounts(store.orders);

  const shipDateForSelected = addDays(selectedDate, 1);

  const dayShipments = [];
  store.orders.forEach((o) => o.shipments.forEach((s, idx) => { if (s.shipDate === shipDateForSelected) dayShipments.push({ order: o, shipment: s, shipmentIdx: idx }); }));
  const dayProduction = productionBreakdown(store.orders, shipDateForSelected);

  const monthDates = useMemo(() => {
    const first = viewMonth;
    const startDow = first.getDay();
    const daysInMonth = new Date(first.getFullYear(), first.getMonth() + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < startDow; i++) cells.push(null);
    for (let d = 1; d <= daysInMonth; d++) cells.push(toISODate(new Date(first.getFullYear(), first.getMonth(), d)));
    return cells;
  }, [viewMonth]);

  return (
    <div>
      <SectionTitle title="製作排程" sub="出貨前一天製作，例如 9/2 出貨則對應 9/1 製作；日曆顯示的是製作日" />
      <div style={{ display: "flex", gap: "12px", flexWrap: "wrap", marginBottom: "24px" }}>
        <AdminMetric label="蛋黃酥 總訂購顆數" value={Math.round(global.counts.danhuang)} tone="persimmon" />
        <AdminMetric label="蛋黃酥 尚未出貨顆數" value={Math.round(global.unshipped.danhuang)} tone="gold" />
        <AdminMetric label="紅豆麻糬酥 總訂購顆數" value={Math.round(global.counts.hongdou)} tone="persimmon" />
        <AdminMetric label="紅豆麻糬酥 尚未出貨顆數" value={Math.round(global.unshipped.hongdou)} tone="gold" />
      </div>

      <div className="admin-schedule-grid">
        <Card>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: "12px" }}>
            <button onClick={() => setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth() - 1, 1))} style={{ background: "none", border: "none", fontSize: "16px", cursor: "pointer", color: TOKENS.color.brown }}>‹</button>
            <div style={{ fontWeight: 700, color: TOKENS.color.brown }}>{viewMonth.getFullYear()} 年 {MONTH_LABELS[viewMonth.getMonth()]}</div>
            <button onClick={() => setViewMonth(new Date(viewMonth.getFullYear(), viewMonth.getMonth() + 1, 1))} style={{ background: "none", border: "none", fontSize: "16px", cursor: "pointer", color: TOKENS.color.brown }}>›</button>
          </div>
          <div style={{ fontSize: "11px", color: TOKENS.color.brownSoft, marginBottom: "8px" }}>📅 此為製作日曆（非出貨日曆）</div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: "3px", marginBottom: "4px" }}>
            {WEEKDAY_LABELS.map((w) => <div key={w} style={{ textAlign: "center", fontSize: "11px", color: TOKENS.color.brownSoft, fontWeight: 700 }}>{w}</div>)}
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(7,1fr)", gap: "3px" }}>
            {monthDates.map((iso, i) => {
              if (!iso) return <div key={`e${i}`} />;
              const inWindow = isWithinProductionWindow(iso);
              const dayNum = parseISODate(iso).getDate();
              const shipDate = addDays(iso, 1);
              const hasOrders = inWindow && store.orders.some((o) => o.shipments.some((s) => s.shipDate === shipDate));
              const isSelected = iso === selectedDate;
              const isToday = iso === toISODate(new Date());
              return (
                <button
                  key={iso}
                  disabled={!inWindow}
                  onClick={() => inWindow && setSelectedDate(iso)}
                  style={{
                    padding: "8px 2px", borderRadius: TOKENS.radius.sm, cursor: inWindow ? "pointer" : "default", position: "relative",
                    border: isSelected ? `2px solid ${TOKENS.color.persimmon}` : isToday ? `1.5px solid ${TOKENS.color.gold}` : "1.5px solid transparent",
                    background: isSelected ? "#FCEFE9" : "transparent", fontSize: "13px", color: TOKENS.color.brown, fontWeight: isSelected ? 800 : 500,
                    opacity: inWindow ? 1 : 0.3,
                  }}
                >
                  {dayNum}
                  {hasOrders && <div style={{ width: "4px", height: "4px", borderRadius: "50%", background: TOKENS.color.persimmon, margin: "3px auto 0" }} />}
                </button>
              );
            })}
          </div>
        </Card>

        <div>
          <Card style={{ marginBottom: "16px", background: "#FBF0DC" }}>
            <div style={{ fontFamily: fontDisplay, fontWeight: 700, fontSize: "18px", color: TOKENS.color.brown, marginBottom: "4px" }}>{selectedDate} 製作品項</div>
            <div style={{ fontSize: "12px", color: TOKENS.color.brownSoft, marginBottom: "10px" }}>對應 {shipDateForSelected} 出貨</div>
            <div style={{ display: "flex", gap: "20px", flexWrap: "wrap" }}>
              <div><div style={{ fontSize: "12px", color: TOKENS.color.brownSoft, fontWeight: 700 }}>🥮 蛋黃酥</div><div style={{ fontFamily: fontNum, fontSize: "24px", fontWeight: 800, color: TOKENS.color.persimmon }}>{Math.round(dayProduction.danhuang)} 顆</div></div>
              <div><div style={{ fontSize: "12px", color: TOKENS.color.brownSoft, fontWeight: 700 }}>🍡 紅豆麻糬酥</div><div style={{ fontFamily: fontNum, fontSize: "24px", fontWeight: 800, color: TOKENS.color.persimmon }}>{Math.round(dayProduction.hongdou)} 顆</div></div>
              <div><div style={{ fontSize: "12px", color: TOKENS.color.brownSoft, fontWeight: 700 }}>該出貨日總顆數 / 每日產能</div><div style={{ fontFamily: fontNum, fontSize: "24px", fontWeight: 800, color: TOKENS.color.brown }}>{store.bookedByDate[shipDateForSelected] || 0} / {dailyCapacity(shipDateForSelected)}</div></div>
            </div>
          </Card>

          <div style={{ fontWeight: 700, color: TOKENS.color.brown, marginBottom: "10px" }}>{shipDateForSelected} 出貨訂單（{dayShipments.length} 筆）</div>
          {dayShipments.length === 0 && <Card style={{ textAlign: "center", color: TOKENS.color.brownSoft, fontSize: "13px" }}>當日尚無訂單</Card>}
          <div style={{ display: "grid", gap: "10px" }}>
            {dayShipments.map(({ order, shipment }, i) => (
              <Card key={i} style={{ padding: "16px" }}>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <span style={{ fontFamily: fontNum, fontWeight: 700, color: TOKENS.color.brown }}>{order.id}</span>
                  <Pill tone={STATUS_MAP[shipment.status].tone}>{STATUS_MAP[shipment.status].label}</Pill>
                </div>
                <div style={{ fontSize: "13px", color: TOKENS.color.brownSoft, marginTop: "6px" }}>{order.buyerName}｜{order.buyerPhone}｜{SHIP_METHODS.find((m) => m.id === shipment.shipMethodId)?.label}</div>
                <div style={{ fontSize: "13px", color: TOKENS.color.brownSoft, marginTop: "2px" }}>{shipment.items.map((item) => `${item.productName} ${item.tierLabel}x${item.boxCount}盒`).join("、")}</div>
              </Card>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function EditShipmentModal({ order, shipmentIdx, onClose, onSave }) {
  const shipment = order.shipments[shipmentIdx];
  const [shipDate, setShipDate] = useState(shipment.shipDate);
  const [shipMethodId, setShipMethodId] = useState(shipment.shipMethodId);
  const [shipInfo, setShipInfo] = useState(shipment.shipInfo || { recipient: "", phone: "", address: "", store: "" });
  const [selections, setSelections] = useState(() => {
    const sel = {};
    shipment.items.forEach((it) => {
      const product = PRODUCTS.find((p) => p.id === it.productId);
      const tierIdx = product.tiers.findIndex((t) => t.qty === it.tierQty);
      sel[`${it.productId}::${tierIdx}`] = it.boxCount;
    });
    return sel;
  });

  const derivedItems = useMemo(() => selectionsToItems(selections), [selections]);
  const method = SHIP_METHODS.find((m) => m.id === shipMethodId);
  const needsAddress = method?.type === "home";
  const needsStore = method?.type === "cvs";
  const needsContact = method?.type !== "pickup";

  const canSave = derivedItems.length > 0 && shipDate && (!needsContact || (shipInfo.recipient?.trim() && shipInfo.phone?.trim() && (!needsAddress || shipInfo.address?.trim()) && (!needsStore || shipInfo.store?.trim())));

  function handleSave() {
    onSave({ shipDate, shipMethodId, shipInfo: needsContact ? shipInfo : null, items: derivedItems, shippingFee: method.fee });
  }

  return (
    <div style={{ position: "fixed", inset: 0, background: "rgba(91,58,41,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 1000, padding: "20px" }} onClick={onClose}>
      <div style={{ background: TOKENS.color.card, borderRadius: TOKENS.radius.lg, padding: "24px", maxWidth: "640px", width: "100%", maxHeight: "88vh", overflowY: "auto" }} onClick={(e) => e.stopPropagation()}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: "16px" }}>
          <div style={{ fontFamily: fontDisplay, fontWeight: 700, fontSize: "18px", color: TOKENS.color.brown }}>編輯出貨內容｜{order.id}</div>
          <button onClick={onClose} style={{ background: "none", border: "none", fontSize: "22px", cursor: "pointer", color: TOKENS.color.brownSoft, lineHeight: 1 }}>×</button>
        </div>

        <Field label="出貨日期" required><TextInput type="date" value={shipDate} onChange={(e) => setShipDate(e.target.value)} min={ORDER_WINDOW.start} max={ORDER_WINDOW.end} /></Field>

        <div style={{ fontSize: "13px", fontWeight: 700, color: TOKENS.color.brown, margin: "16px 0 8px" }}>禮盒品項</div>
        <div style={{ display: "grid", gap: "10px", marginBottom: "16px" }}>
          {PRODUCTS.map((product) => (
            <div key={product.id} style={{ border: `1px solid ${TOKENS.color.line}`, borderRadius: TOKENS.radius.sm, padding: "10px 12px" }}>
              <div style={{ fontWeight: 700, fontSize: "13.5px", color: TOKENS.color.brown, marginBottom: "8px" }}>{product.emoji} {product.name}</div>
              <div style={{ display: "flex", gap: "10px", flexWrap: "wrap" }}>
                {product.tiers.map((tier, tierIdx) => {
                  const key = `${product.id}::${tierIdx}`;
                  return <TierBoxSelector key={key} tier={tier} count={selections[key] || 0} onChange={(val) => setSelections((prev) => ({ ...prev, [key]: val }))} />;
                })}
              </div>
            </div>
          ))}
        </div>

        <Field label="出貨方式" required>
          <select value={shipMethodId} onChange={(e) => setShipMethodId(e.target.value)} style={inputStyle}>
            {SHIP_METHODS.map((m) => <option key={m.id} value={m.id}>{m.label}</option>)}
          </select>
        </Field>

        {needsContact && (
          <>
            <Field label="收件人姓名" required><TextInput value={shipInfo.recipient || ""} onChange={(e) => setShipInfo({ ...shipInfo, recipient: e.target.value })} /></Field>
            <Field label="聯絡電話" required><TextInput value={shipInfo.phone || ""} onChange={(e) => setShipInfo({ ...shipInfo, phone: e.target.value })} /></Field>
            {needsAddress && <Field label="寄送地址" required><TextInput value={shipInfo.address || ""} onChange={(e) => setShipInfo({ ...shipInfo, address: e.target.value })} /></Field>}
            {needsStore && <Field label="門市名稱及代碼" required hint="例：全家 板橋文化店 (012345)"><TextInput value={shipInfo.store || ""} onChange={(e) => setShipInfo({ ...shipInfo, store: e.target.value })} /></Field>}
          </>
        )}

        <div style={{ display: "flex", justifyContent: "space-between", fontWeight: 800, color: TOKENS.color.brown, margin: "16px 0", paddingTop: "12px", borderTop: `1px dashed ${TOKENS.color.line}` }}>
          <span>此筆出貨小計</span>
          <span style={{ fontFamily: fontNum, color: TOKENS.color.persimmon }}>${derivedItems.reduce((s, i) => s + i.lineTotal, 0) + (method?.fee || 0)}</span>
        </div>

        <div style={{ display: "flex", gap: "10px" }}>
          <Button variant="ghost" onClick={onClose} style={{ flex: 1 }}>取消</Button>
          <Button variant="primary" onClick={handleSave} disabled={!canSave} style={{ flex: 1 }}>儲存修改</Button>
        </div>
      </div>
    </div>
  );
}

        {error && (
          <div style={{ color: TOKENS.color.persimmonDark, fontSize: "13px", fontWeight: 700, marginBottom: "12px", background: "#FBEAE6", padding: "8px 12px", borderRadius: TOKENS.radius.sm }}>
            儲存失敗：{error}
          </div>
        )}

        <div style={{ display: "flex", gap: "10px" }}>
          <Button variant="ghost" onClick={onClose} style={{ flex: 1 }} disabled={saving}>取消</Button>
          <Button variant="primary" onClick={handleSave} disabled={!canSave} style={{ flex: 1 }}>{saving ? "儲存中…" : "儲存"}</Button>
        </div>
      </div>
    </div>
  );
}

function AllOrdersAdmin({ store }) {
  const [filterStatus, setFilterStatus] = useState("all");

  const [expandedNotes, setExpandedNotes] = useState({}); // { [orderId]: boolean }

  const shipmentRows = [];
  store.orders.forEach((order) => order.shipments.forEach((shipment, shipmentIdx) => shipmentRows.push({ order, shipment, shipmentIdx })));

  const totalOrders = store.orders.length;
  const revenue = shipmentRows.reduce((sum, r) => sum + r.shipment.items.reduce((s, i) => s + i.lineTotal, 0), 0);
  let danhuangQty = 0, hongdouQty = 0;
  shipmentRows.forEach((r) => r.shipment.items.forEach((item) => {
    if (item.productId === "danhuang") danhuangQty += item.pieces;
    else if (item.productId === "hongdou") hongdouQty += item.pieces;
    else if (item.productId === "combo") { danhuangQty += item.pieces / 2; hongdouQty += item.pieces / 2; }
  }));

  const filtered = shipmentRows.filter(({ order, shipment }) => {
    if (filterStatus !== "all" && shipment.status !== filterStatus) return false;
    if (search && !`${order.id} ${order.buyerName} ${order.buyerPhone}`.toLowerCase().includes(search.toLowerCase())) return false;
    return true;
  });

  const editingOrder = editing ? store.orders.find((o) => o.id === editing.orderId) : null;

  return (

        <AdminMetric label="紅豆麻糬酥訂購顆數" value={Math.round(hongdouQty)} tone="gold" />

      <div style={{ display: "flex", gap: "10px", marginBottom: "16px", flexWrap: "wrap", alignItems: "center" }}>
        <TextInput placeholder="搜尋訂單編號 / 姓名 / 電話" value={search} onChange={(e) => setSearch(e.target.value)} style={{ maxWidth: "280px" }} />
        {["all", "pending", "confirmed", "shipped"].map((s) => (
          <button key={s} onClick={() => setFilterStatus(s)} style={{ padding: "8px 16px", borderRadius: TOKENS.radius.full, cursor: "pointer", fontSize: "13px", fontWeight: 700, border: filterStatus === s ? `2px solid ${TOKENS.color.persimmon}` : `1.5px solid ${TOKENS.color.line}`, background: filterStatus === s ? "#FCEFE9" : TOKENS.color.card, color: TOKENS.color.brown }}>

                      >

                        <div style={{ marginTop: "6px", fontSize: "12.5px", color: TOKENS.color.brown, background: "#FBF0DC", padding: "8px 10px", borderRadius: TOKENS.radius.sm, whiteSpace: "pre-wrap", maxWidth: "260px" }}>
                          {order.note}

                      )}

                    <span style={{ color: TOKENS.color.brownSoft }}>—</span>
                  )}

                  <button onClick={() => setEditing({ orderId: order.id, shipmentIdx })} style={{ fontSize: "12px", fontWeight: 700, color: TOKENS.color.persimmon, background: "none", border: `1px solid ${TOKENS.color.persimmon}`, borderRadius: TOKENS.radius.full, padding: "5px 12px", cursor: "pointer" }}>編輯</button>

      </div>

      {editingOrder && (
        <EditShipmentModal order={editingOrder} shipmentIdx={editing.shipmentIdx} onClose={() => setEditing(null)} onSave={(newData) => { store.updateShipment(editing.orderId, editing.shipmentIdx, newData); setEditing(null); }} />
      )}
    </div>
  );
}

/* ============================================================================
   後台管理員登入（真正的 Supabase Auth：Email + 密碼）
============================================================================ */
function AdminGate({ store }) {
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");

  async function handleSubmit() {
    if (!email.trim() || !pw) return;
    try {
      await store.adminSignIn(email.trim(), pw);
    } catch (err) {
      // 錯誤訊息已經放進 store.adminError，這裡不用再處理
    }
  }

  return (
    <div style={{ maxWidth: "400px", margin: "60px auto" }}>
      <Card>
        <div style={{ fontSize: "32px", textAlign: "center", marginBottom: "8px" }}>🔒</div>
        <div style={{ fontFamily: fontDisplay, fontWeight: 700, fontSize: "18px", color: TOKENS.color.brown, textAlign: "center", marginBottom: "4px" }}>
          後台管理員登入
        </div>
        <div style={{ fontSize: "13px", color: TOKENS.color.brownSoft, textAlign: "center", marginBottom: "20px" }}>
          請使用管理員 Email 與密碼登入
        </div>
        <Field label="Email" required>
          <TextInput
            type="email"
            value={email}
            onChange={(e) => setEmail(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && handleSubmit()}
            placeholder="admin@example.com"
          />
        </Field>
        <Field label="密碼" required>
          <TextInput
            type="password"
            value={pw}
            onChange={(e) => setPw(e.target.value)}
            onKeyDown={(e) => e.key === "Enter" && handleSubmit()}
            placeholder="請輸入密碼"
          />
        </Field>
        {store.adminError && (
          <div style={{ color: TOKENS.color.persimmonDark, fontSize: "13px", fontWeight: 700, marginBottom: "12px" }}>
            {store.adminError}
          </div>
        )}
        <Button variant="primary" style={{ width: "100%" }} disabled={store.adminLoading} onClick={handleSubmit}>
          {store.adminLoading ? "登入中…" : "登入後台"}
        </Button>
      </Card>
    </div>
  );
}

      {!showAdminGate && (
        <div style={{ background: TOKENS.color.card, borderBottom: `1px solid ${TOKENS.color.line}` }}>
          <div style={{ maxWidth: "1100px", margin: "0 auto", padding: "0 24px", display: "flex", gap: "4px", overflowX: "auto" }}>
            {NAV.filter((n) => n.area === mode).map((n) => (
              <button key={n.id} onClick={() => setPage(n.id)} style={{ padding: "14px 18px", border: "none", background: "none", cursor: "pointer", fontSize: "14px", fontWeight: 700, whiteSpace: "nowrap", color: page === n.id ? TOKENS.color.persimmon : TOKENS.color.brownSoft, borderBottom: page === n.id ? `3px solid ${TOKENS.color.persimmon}` : "3px solid transparent" }}>{n.label}</button>
            ))}
          </div>
        </div>
      )}

      <main style={{ maxWidth: "1100px", margin: "0 auto", padding: "32px 24px 80px" }}>
        {showAdminGate ? (
          <AdminGate store={store} />
        ) : (
          <>
            {page === "order" && <OrderingFlow store={store} />}
            {page === "remit" && <RemittanceFlow store={store} initialOrderId={initialParams.order} />}
            {page === "lookup" && <OrderLookupFlow store={store} />}
            {page === "help" && <HelpGuide />}
            {page === "admin-schedule" && <ProductionSchedule store={store} />}
            {page === "admin-orders" && <AllOrdersAdmin store={store} />}
            {page === "admin-reconcile" && <ReconciliationAdmin store={store} />}
          </>
        )}
      </main>

      <footer style={{ textAlign: "center", padding: "24px", fontSize: "12px", color: TOKENS.color.brownSoft }}>甜度瑞拉 · 中秋限定手作禮盒訂購系統</footer>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script></body></html>
